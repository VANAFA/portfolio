<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Blog</title>
<link rel="stylesheet" href="css/win98.css">
</head>
<body>

  <section class="window raised">
    <div class="title-bar">
      <div class="title-bar-text"><img class="icon-inline" src="images/icons/notepad.svg" alt=""> Project Blog</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize">_</button>
        <button aria-label="Maximize">□</button>
        <button aria-label="Close">✕</button>
      </div>
    </div>
    <div class="window-body" id="blog-root">
      <p>Loading…</p>
    </div>
  </section>

  <section class="window raised contact-window">
    <div class="title-bar">
      <div class="title-bar-text"><img class="icon-inline" src="images/icons/phone.svg" alt=""> Contact</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize">_</button>
        <button aria-label="Maximize">□</button>
        <button aria-label="Close">✕</button>
      </div>
    </div>
    <div class="window-body">
      <div class="contact-grid">
        <div class="contact-item"><strong>Email</strong><a href="mailto:nallibfadel@gmail.com">nallibfadel@gmail.com</a></div>
        <div class="contact-item"><strong>GitHub</strong><a href="https://github.com/VANAFA" target="_blank" rel="noopener">github.com/VANAFA</a></div>
        <div class="contact-item"><strong>LinkedIn</strong><a href="https://www.linkedin.com/in/nallib-fadel-1b4332303/" target="_blank" rel="noopener">linkedin.com/in/nallib-fadel-1b4332303</a></div>
        <div class="contact-item"><strong>Location</strong>Buenos Aires, Argentina</div>
      </div>
    </div>
  </section>

  <div class="taskbar">
    <div class="start-btn btn98"><img class="icon-inline" src="images/icons/flag.svg" alt=""> Start</div>
    <div class="taskbar-clock" id="taskbar-clock"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/taskbar.js"></script>
</body>
</html>
